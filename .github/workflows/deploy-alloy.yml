name: Build and Deploy Alloy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACA_ENV_NAME: ${{ vars.AZURE_ACA_ENV_NAME }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

  AZURE_ALLOY_APP_NAME: ${{ vars.AZURE_ALLOY_APP_NAME }}
  ALLOY_IMAGE_NAME: ${{ vars.ALLOY_IMAGE_NAME }}

jobs:

  build:
    name: Build and Push Alloy Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Resolve ACR login server
        id: acr
        shell: bash
        run: |
          set -euo pipefail

          ACR_LOGIN_SERVER="$(
            az acr show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_ACR_NAME" \
              --query loginServer \
              --output tsv
          )"

          test -n "$ACR_LOGIN_SERVER"

          echo "login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: |
          az acr login \
            --name "$AZURE_ACR_NAME"

      - name: Calculate image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::8}"

          IMAGE="${{ steps.acr.outputs.login_server }}/${ALLOY_IMAGE_NAME}:${IMAGE_TAG}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "Image: $IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Alloy image
        uses: docker/build-push-action@v6
        with:
          context: ./otel-alloy
          file: ./otel-alloy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}

      - name: Verify image in ACR
        run: |
          az acr repository show \
            --name "$AZURE_ACR_NAME" \
            --image "${ALLOY_IMAGE_NAME}:${{ steps.image.outputs.image_tag }}" \
            --output table

  deploy:
    name: Deploy Alloy Container App
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy Alloy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACA_ENV_NAME: ${{ vars.AZURE_ACA_ENV_NAME }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

          AZURE_ALLOY_APP_NAME: ${{ vars.AZURE_ALLOY_APP_NAME }}
          AZURE_ALLOY_IMAGE: ${{ needs.build.outputs.image }}

          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}

        run: |
          chmod +x ./infra/deploy-alloy.sh
          ./infra/deploy-alloy.sh

      - name: Verify Alloy
        run: |
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_ALLOY_APP_NAME" \
            --query '{
              name:name,
              provisioningState:properties.provisioningState,
              runningStatus:properties.runningStatus
            }' \
            --output yaml


