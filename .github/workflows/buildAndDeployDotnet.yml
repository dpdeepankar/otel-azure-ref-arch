name: Build and Deploy .NET

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACA_ENV_NAME: ${{ vars.AZURE_ACA_ENV_NAME }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

  DOTNET_APP_NAME: ${{ vars.DOTNET_APP_NAME }}
  DOTNET_IMAGE_NAME: ${{ vars.DOTNET_IMAGE_NAME }}

jobs:

  #######################################
  # Build
  #######################################

  build:
    name: Build and Push .NET Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      #######################################
      # Azure authentication
      #######################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      #######################################
      # Resolve ACR
      #######################################

      - name: Resolve ACR login server
        id: acr
        shell: bash
        run: |
          set -euo pipefail

          ACR_LOGIN_SERVER="$(
            az acr show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_ACR_NAME" \
              --query loginServer \
              --output tsv
          )"

          if [[ -z "$ACR_LOGIN_SERVER" ]]; then
            echo "ERROR: Could not resolve ACR login server."
            exit 1
          fi

          echo "ACR login server: $ACR_LOGIN_SERVER"

          echo "login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      #######################################
      # ACR authentication
      #######################################

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "$AZURE_ACR_NAME"

      #######################################
      # Calculate image reference
      #######################################

      - name: Calculate image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::8}"

          IMAGE="${{ steps.acr.outputs.login_server }}/${DOTNET_IMAGE_NAME}:${IMAGE_TAG}"

          echo "Image:"
          echo "  $IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      #######################################
      # Buildx
      #######################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #######################################
      # Build and push
      #######################################

      - name: Build and push .NET image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/otel-dotnet
          file: ./apps/otel-dotnet/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}

      #######################################
      # Verify image
      #######################################

      - name: Verify image in ACR
        run: |
          set -euo pipefail

          az acr repository show \
            --name "$AZURE_ACR_NAME" \
            --image "${DOTNET_IMAGE_NAME}:${{ steps.image.outputs.image_tag }}" \
            --output table

  #######################################
  # Deploy
  #######################################

  deploy:
    name: Deploy .NET Container App
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      #######################################
      # Azure authentication
      #######################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      #######################################
      # Deploy
      #######################################

      - name: Deploy .NET Container App
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACA_ENV_NAME: ${{ vars.AZURE_ACA_ENV_NAME }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

          DOTNET_APP_NAME: ${{ vars.DOTNET_APP_NAME }}
          DOTNET_IMAGE_NAME: ${{ vars.DOTNET_IMAGE_NAME }}
          DOTNET_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

          AZURE_DOTNET_IMAGE: ${{ needs.build.outputs.image }}

          AZURE_ALLOY_APP_NAME: ${{ vars.AZURE_ALLOY_APP_NAME }}

        run: |
          chmod +x ./infra/deploy-dotnet.sh
          ./infra/deploy-dotnet.sh

      #######################################
      # Deployment verification
      #######################################

      - name: Verify Container App
        run: |
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DOTNET_APP_NAME" \
            --query '{
              name:name,
              provisioningState:properties.provisioningState,
              runningStatus:properties.runningStatus
            }' \
            --output yaml

      #######################################
      # Summary
      #######################################

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo " .NET deployment complete"
          echo "=============================================="
          echo
          echo "Application:"
          echo "  $DOTNET_APP_NAME"
          echo
          echo "Image:"
          echo "  ${{ needs.build.outputs.image }}"
          echo
          echo "Platform:"
          echo "  linux/amd64"

